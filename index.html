            min-width: 140px;
        }

            background-color: #ff4d4d;
            transform: scale(1.05);
        }

        .btn.nope-btn {
            position: relative;
        }

            position: absolute;
            animation: shake 0.3s infinite;
        }

            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }
